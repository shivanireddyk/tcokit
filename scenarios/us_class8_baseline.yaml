# Class 8 long-haul tractor, United States, no policy support.
#
# Every figure is a string so the number in this file is the number used in the
# arithmetic. Floats are rejected on load.
#
# Figures are order-of-magnitude public reference values for demonstration.
# Before using this for analysis, replace them with sourced numbers and record
# the source next to each line. The model is the contribution here; the inputs
# are the analyst's responsibility.

